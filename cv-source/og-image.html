<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <title>Image de partage — gregoire-raturat.fr</title>
    <!-- Rendu en 1200×630 par scripts/build-cv.sh og → public/og-image.jpg et .webp -->
    <link rel="stylesheet" href="fonts/fonts.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 1200px; height: 630px; overflow: hidden; }
        body {
            position: relative;
            font-family: 'DM Sans', system-ui, sans-serif;
            color: #2a2826;
            background:
                linear-gradient(rgba(139, 111, 92, 0.045) 1px, transparent 1px) 0 0 / 50px 50px,
                linear-gradient(90deg, rgba(139, 111, 92, 0.045) 1px, transparent 1px) 0 0 / 50px 50px,
                linear-gradient(135deg, #fefcf8 0%, #f5f0e8 100%);
        }
        .circle { position: absolute; border-radius: 50%; border: 1px solid rgba(139, 111, 92, 0.16); }
        .c1 { width: 360px; height: 360px; right: 40px; top: -150px; }
        .c2 { width: 240px; height: 240px; right: -70px; bottom: 30px; }
        .text { position: absolute; left: 80px; top: 64px; width: 700px; }
        .logo { width: 62px; height: 57px; fill: #8b6f5c; display: block; margin-bottom: 40px; }
        .label { display: flex; align-items: center; gap: 18px; font-family: 'Space Mono', monospace; font-weight: 700;
                 font-size: 21px; letter-spacing: 0.16em; text-transform: uppercase; color: #8b6f5c; }
        .label::before { content: ''; width: 46px; height: 2px; background: #8b6f5c; }
        h1 { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 88px; line-height: 1.04;
             letter-spacing: -0.01em; margin: 16px 0 22px; }
        .tagline { font-size: 29px; line-height: 1.42; color: #6b6560; max-width: 690px; }
        .chips { position: absolute; left: 80px; bottom: 58px; display: flex; gap: 14px; }
        .chip { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 18px; color: #6e5747;
                background: #e8dfd0; border-radius: 999px; padding: 12px 22px; white-space: nowrap; }
        .chip.dark { background: #6e5747; color: #fefcf8; }
        .photo { position: absolute; right: 80px; top: 92px; width: 290px; height: 380px; border-radius: 30px;
                 overflow: hidden; background: #e5dbc8;
                 box-shadow: 0 24px 60px rgba(42, 40, 38, 0.14), 0 0 0 1px rgba(139, 111, 92, 0.1); }
        .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .photo::after { content: ''; position: absolute; inset: 0;
                        background: linear-gradient(180deg, transparent 62%, rgba(139, 111, 92, 0.28) 100%); }
    </style>
</head>
<body>
    <div class="circle c1"></div>

            </g>

        <p class="label">Développeur Full-Stack · Lyon</p>
        <h1>Grégoire Raturat</h1>

    <div class="photo"><img src="../public/photoCV.webp" alt="" /></div>

    <div class="chips">
        <span class="chip">Vue.js · React · React Native</span>
        <span class="chip">Node.js · Django</span>
