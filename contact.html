<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Submission Success</title>
</head>
<body>
  <form name="contact" method="post" data-netlify="true">
    <input
      type="email"
      name="name"
      id="nme"
      autocomplete="off"
      placeholder="Your Name"
      aria-label="Nom"
    />
    <textarea
      name="message"
      rows="2"
      id="msg"
      autocomplete="off"
      aria-label="Question"
    ></textarea>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
