# ============================================================
# NETLIFY CONFIGURATION — gregoire-raturat.fr
# ============================================================

[build]
  command = "npm run generate"
  publish = "dist/"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--legacy-peer-deps"

# ============================================================
# REDIRECTS
# ============================================================

# Forcer HTTPS + www → non-www
[[redirects]]
  from = "https://www.gregoire-raturat.fr/*"
  to   = "https://gregoire-raturat.fr/:splat"
  status = 301
  force  = true


# ============================================================
# HEADERS DE SÉCURITÉ & PERFORMANCE
# ============================================================

# Assets statiques — cache long terme (immutable)
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicons & manifest — cache court
[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Robots & sitemap — toujours frais
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Headers globaux (sécurité)
[[headers]]
  for = "/*"
  [headers.values]
    # Sécurité
    X-Frame-Options              = "DENY"
    X-Content-Type-Options       = "nosniff"
    X-XSS-Protection             = "1; mode=block"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "camera=(), microphone=(), geolocation=(), payment=()"

    # CSP — adapte les domaines si tu ajoutes des services tiers
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://fonts.googleapis.com https://fonts.gstatic.com https://www.googletagmanager.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co https://api.netlify.com;"

    # HSTS (HTTPS strict — active uniquement si ton domaine est 100% HTTPS)
    Strict-Transport-Security    = "max-age=31536000; includeSubDomains; preload"

    # Performance
    X-DNS-Prefetch-Control       = "on"

[[headers]]
  for = "/_payload.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_payload.json*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"