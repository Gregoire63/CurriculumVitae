# ============================================================
# NETLIFY CONFIGURATION — gregoire-raturat.fr
# ============================================================

[build]
  # `nuxt build` et NON `nuxt generate`.
  #
  # Depuis le départ de /sport le site n'a plus aucune route serveur : « / » est
  # prérendue et tout le reste est statique. `build` reste néanmoins la commande —
  # Nitro produit le même statique, et la fonction Netlify qu'il déploie en plus ne
  # sert plus que de repli. Passer à `generate` est possible, mais c'est un
  # changement de mode de déploiement : à faire pour lui-même, pas au détour d'un
  # ménage.
  command = "npm run build"
  publish = "dist/"

[build.environment]
  # Nuxt 4.4 exige ^22.12 || ^24.11 || >=26. « 24 » tout court résout vers la
  # dernière 24.x, ce qui passe aujourd'hui mais ne le garantit pas : on épingle.
  NODE_VERSION = "22.12.0"
  # Plus de --legacy-peer-deps : il masquait le conflit eslint 9/10 et laissait
  # npm accepter une résolution incorrecte. Le conflit est corrigé dans
  # package.json ; si l'installation échoue désormais, c'est un vrai problème
  # qu'il faut voir, pas contourner.

# ============================================================
# REDIRECTS
# ============================================================

# /sport a déménagé. L'application vit maintenant dans son propre dépôt
# (damn-claude) et sur son propre domaine. On garde les anciennes adresses
# vivantes : c'est depuis /sport que la PWA a été installée sur le téléphone, et
# un raccourci d'écran d'accueil ne se met pas à jour tout seul.
#
# Ces règles sont AVANT la normalisation www : une entrée sur www.…/sport part
# ainsi directement au bon endroit, sans rebond intermédiaire.
[[redirects]]
  from = "/sport"
  to   = "https://damnclaude.gregoire-raturat.fr/"
  status = 301
  force  = true

[[redirects]]
  from = "/sport/*"
  to   = "https://damnclaude.gregoire-raturat.fr/:splat"
  status = 301
  force  = true

# Forcer HTTPS + www → non-www
[[redirects]]
  from = "https://www.gregoire-raturat.fr/*"
  to   = "https://gregoire-raturat.fr/:splat"
  status = 301
  force  = true


# ============================================================
# HEADERS DE SÉCURITÉ & PERFORMANCE
# ============================================================

# Assets statiques — cache long terme (immutable)
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicons & manifest — cache court
[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Robots & sitemap — toujours frais
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Headers globaux (sécurité)
[[headers]]
  for = "/*"
  [headers.values]
    # Sécurité
    X-Frame-Options              = "DENY"
    X-Content-Type-Options       = "nosniff"
    X-XSS-Protection             = "1; mode=block"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "camera=(), microphone=(), geolocation=(), payment=()"

    # CSP — adapte les domaines si tu ajoutes des services tiers
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https: blob:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://stats.g.doubleclick.net https://www.googletagmanager.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.netlify.com;"

    # HSTS (HTTPS strict — active uniquement si ton domaine est 100% HTTPS)
    Strict-Transport-Security    = "max-age=31536000; includeSubDomains; preload"

    # Performance
    X-DNS-Prefetch-Control       = "on"

[[headers]]
  for = "/_payload.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_payload.json*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"