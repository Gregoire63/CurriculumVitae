<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulaire de Contact - Envoyé</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #fefcf8 0%, #f5f3ef 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
      }

      .container {
        background: white;
        border-radius: 24px;
        padding: 3rem;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        text-align: center;
        animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        background: linear-gradient(135deg, #8b6f5c 0%, #a08775 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
      }

      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.5);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .checkmark {
        width: 40px;
        height: 40px;
        stroke: white;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        animation: drawCheck 0.6s ease-out 0.5s both;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
      }

      @keyframes drawCheck {
        to {
          stroke-dashoffset: 0;
        }
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 1rem;
        animation: fadeIn 0.6s ease-out 0.4s both;
      }

      p {
        font-size: 1.125rem;
        color: #666;
        line-height: 1.6;
        margin-bottom: 2rem;
        animation: fadeIn 0.6s ease-out 0.5s both;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .redirect-info {
        font-size: 0.875rem;
        color: #999;
        margin-top: 1rem;
        animation: fadeIn 0.6s ease-out 0.6s both;
      }

      .loader {
        display: inline-flex;
        gap: 4px;
        margin-left: 8px;
      }

      .loader span {
        width: 6px;
        height: 6px;
        background: #8b6f5c;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
      }

      .loader span:nth-child(1) {
        animation-delay: -0.32s;
      }

      .loader span:nth-child(2) {
        animation-delay: -0.16s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Hidden Netlify form */
      form {
        display: none;
      }

      @media (max-width: 640px) {
        .container {
          padding: 2rem;
        }

        h1 {
          font-size: 1.5rem;
        }

        p {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Hidden form for Netlify detection -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <textarea name="message"></textarea>
    </form>

    <!-- Success message -->
    <div class="container">
      <div class="icon">
        <svg class="checkmark" viewBox="0 0 52 52">
          <path d="M14 27l7 7 16-16" />
        </svg>
      </div>

      <h1>Message envoyé !</h1>
      <p>
        Merci pour votre message. Je vous répondrai dans les plus brefs délais.
      </p>

      <div class="redirect-info">
        Redirection vers l'accueil
        <span class="loader">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </div>
    </div>

    <script>
      // Redirect after 3 seconds
      setTimeout(() => {
        window.location.href = '/'
      }, 3000)
    </script>
  </body>
</html>
